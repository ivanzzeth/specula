# Specula — centrally hosted, stateless deployment profile (Alibaba Cloud).
#
# ONE file, ONE command:
#
#   cp deploy/profiles/hosted-aliyun.example.yaml specula-deploy.yaml
#   $EDITOR specula-deploy.yaml            # fill in the <> placeholders
#   specula cluster install --values specula-deploy.yaml --wait
#
# Nothing else: the chart creates the credential Secret from the values below, so
# there is no separate `kubectl create secret` step.
#
# The real file holds a database password and an OSS secret key — keep it out of
# git. Anything named *specula-deploy*.yaml and the whole /tmp/ directory are
# already ignored (.gitignore); do not rename it into a tracked path.
#
# This profile is the STATELESS shape: Postgres for metadata + object storage for
# blobs, so no PVC, no node pinning, replicas can scale and a lost node costs
# nothing. That is what lets ONE Specula serve many clusters instead of every
# cluster running its own.

# ── Image ─────────────────────────────────────────────────────────────────────
# Must be pullable FROM THE NODES. Inside China that means your own cloud-region
# registry: Docker Hub and every public CN mirror measured were unusable
# (docs/RELEASE.md has the numbers). Prefer the VPC endpoint — same bytes, no
# public egress bill.
image:
  repository: <registry-vpc-host>/<namespace>/specula
  tag: v0.11.1
  pullPolicy: IfNotPresent

# ── Replicas ──────────────────────────────────────────────────────────────────
# ha=true switches on the cross-replica stampede lock. lockDriver=postgres uses
# advisory locks on the metadata pool, so no Redis is needed — size the Postgres
# connection pool for concurrent cold misses.
ha: true
lockDriver: postgres
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# ── Metadata: PostgreSQL ──────────────────────────────────────────────────────
# Schema migrations run automatically at startup (embedded goose).
# This DB is NOT only a cache: it holds TOFU pins and user accounts too, so back it
# up like a database, not like a cache.
#
# The account needs CREATE on the target schema. On PostgreSQL 15+ (Aliyun RDS PG
# 15/16/17 included) the `public` schema no longer grants CREATE to ordinary users,
# so a plain account fails at startup with:
#   create version table "goose_db_version": permission denied for schema public
# Fix it once, as a privileged account:
#   GRANT ALL ON SCHEMA public TO <user>;      -- or ALTER SCHEMA public OWNER TO <user>;
# (Aliyun console: make the account a 高权限账号, or set it as the database owner.)
#
# TLS: sslmode=require needs SSL enabled on the instance — Aliyun RDS ships it OFF,
# and a disabled server answers "tls error: server refused TLS connection". Enable it
# under 数据安全性 → SSL, or use sslmode=disable for VPC-internal traffic.
meta:
  driver: postgres
  dsn: postgres://<user>:<password>@<host>:5432/specula?sslmode=require

# ── Upstreams ─────────────────────────────────────────────────────────────────
# regionProfile=cn turns on the CN chain for non-Hub registries: ghcr.io, quay.io,
# gcr.io and registry.k8s.io get mirror chains (Huawei SWR layout:huawei-ddn →
# DaoCloud → 1ms). Without it, remote_registries is EMPTY and Specula serves only
# Docker Hub — a path-style pull of registry.k8s.io/... returns 404 by design, since
# the allowlist is also the SSRF guard.
regionProfile: cn

# ── Cache capacity ────────────────────────────────────────────────────────────
# 0 (the default) means NEVER evict — object storage then grows without bound.
# Specula evicts oldest-first, unpinned, cached-origin entries only; pinned entries
# and content pushed into Specula are never touched.
#
# Do NOT add an OSS lifecycle rule that deletes objects: capacity accounting comes
# from the metadata store, not from listing the bucket, so objects deleted behind
# Specula's back stay "present" in metadata and reads fail. A rule that only aborts
# INCOMPLETE multipart uploads (say after 7 days) is safe and worth having — an
# interrupted multi-GB layer upload otherwise leaves billable fragments.
cache:
  maxBytes: 500000000000 # 500 GB

# ── Blobs: OSS (S3-compatible) ────────────────────────────────────────────────
# Create a private Standard bucket in the SAME region as the cluster and use the
# -internal endpoint (VPC, no egress charge). Server-side encryption "OSS-managed"
# is free and transparent; do not use KMS (per-object KMS calls on a hot cache).
# Scope the RAM user to this bucket rather than granting OSSFullAccess.
blob:
  driver: s3
  s3:
    bucket: <bucket-name>
    endpoint: https://oss-<region>-internal.aliyuncs.com
    region: <region>
    usePathStyle: false # OSS/COS/OBS are virtual-host style; MinIO needs true
    accessKeyId: <ram-access-key-id>
    secretAccessKey: <ram-access-key-secret>

# Stateless: no volume to own.
persistence:
  enabled: false

# ── Do this cluster's own nodes use Specula? ──────────────────────────────────
# Two shapes, pick deliberately:
#
# a) PURE HOSTING — mirror.enabled=false, integrate.enabled=false. Specula serves
#    other clusters only and never touches the containerd config of the nodes it runs
#    on. Those nodes then pull images the way they always did.
#
# b) HOSTS **AND** SERVES ITSELF (uncommented below) — the mirror DaemonSet writes
#    containerd hosts.toml on every node and integrate fixes the CRI config_path so
#    crictl/kubelet actually honour it. Both are DaemonSets, so new workers are covered
#    automatically and the 5m reconcile repairs drift.
#
# For (b) the endpoint must be reachable FROM THE NODE. This profile exposes Specula
# through an internal LoadBalancer, so there is no NodePort to dial — use the CLB
# address. One address then serves this cluster and every other cluster in the VPC.
#
# skipVerify must stay false for a plain http:// endpoint: skip_verify tells containerd
# to speak TLS, and it would then dial TLS against an HTTP port.
mirror:
  enabled: true
  endpoint: http://<internal-lb-ip>:7733
  skipVerify: false
integrate:
  enabled: true
  protocols: oci
  restartContainerd: once
  reconcileInterval: 5m

# ── Control-plane auth ────────────────────────────────────────────────────────
# There is no default account: the FIRST person to register at the control plane
# becomes admin. Register immediately after install.
# config_secret must be base64 of exactly 32 bytes:  openssl rand -base64 32
# Without it the JWT secret is regenerated on every restart, so every rollout signs
# all users out.
auth:
  configSecret: <openssl rand -base64 32>
  cookieSecure: false # true once the control plane is served over HTTPS

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi
