# Specula — client cluster profile: point this cluster's nodes at a Specula
# hosted elsewhere. Deploys ONLY the mirror + integrate DaemonSets
# (deployment.enabled=false). No Specula pods / PVC / Ingress on the client.
#
# Preferred path (chorei platform — third-party / tenant ACK):
#
#   chorei cluster specula client-wire <cluster> \
#     --endpoint https://specula.example.com \
#     --image registry.example.com/org/specula:v0.12.13 \
#     --yes
#
# Manual helm (same values shape):
#
#   cp deploy/profiles/client-mirror.example.yaml specula-deploy-client.yaml
#   $EDITOR specula-deploy-client.yaml       # set mirror.endpoint + image
#   helm upgrade --install specula-client ./deploy/helm/specula-bootstrap \
#     -n specula-client --create-namespace -f specula-deploy-client.yaml --wait
#
# Auto-adapts to node-pool scaling: DaemonSets write hosts.toml on every
# worker; integrate repairs CRI config_path + drift every 5m.
#
# Two endpoint modes (pick ONE):
#
# | Mode | endpoint | When |
# |---|---|---|
# | **Public HTTPS** | `https://specula.example.com` | Cross-account / third-party ACK; LE/system CA; skipVerify=false |
# | **Intranet HTTP** | `http://10.0.0.0:7733` | Same VPC LB only; never skipVerify for plain http |
#
# Chicken-egg: the Specula *agent* image for the DaemonSets must already be
# pullable before hosts.toml exists (public ACR/Hub or pull secret). Do not
# DaoCloud-rewrite registry.k8s.io — after integrate, public charts pull via Specula.

# No Specula here — this cluster only redirects to the hosted one.
deployment:
  enabled: false

persistence:
  enabled: false

ingress:
  enabled: false

# Host clients use for `docker login` / private push UI (HTTPS public mode).
registryPublicHost: specula.example.com

mirror:
  enabled: true
  # Public HTTPS (preferred for third-party):
  endpoint: https://specula.example.com
  # Intranet same-VPC alternative (uncomment instead of HTTPS):
  # endpoint: http://10.0.0.0:7733
  certsDir: /etc/containerd/certs.d
  # k3s keeps its own certs.d; harmless when the path does not exist.
  k3sCertsDir: /var/lib/rancher/k3s/agent/etc/containerd/certs.d
  registries:
    - docker.io
    - registry.k8s.io
    - k8s.gcr.io
    - ghcr.io
    - quay.io
    - gcr.io
    - codeberg.org
  # true ONLY for HTTPS with a private/non-public CA. Public LE → false.
  # Plain http:// MUST stay false (containerd must not dial TLS to HTTP).
  skipVerify: false

# Fixes CRI config_path so kubelet/crictl honour hosts.toml (containerd 2.2+).
# Full DefaultProtocols — never narrow to oci alone.
integrate:
  enabled: true
  protocols: "go,npm,pypi,oci,helm,git,apt,cargo,conda,hf"
  includeClientProtocols: false
  hold: true
  restartContainerd: once
  reconcileInterval: 5m
  stampHostPath: /var/lib/specula

# Must be pullable BEFORE hosts.toml exists (chicken-egg).
image:
  repository: registry.example.com/org/specula
  tag: v0.12.13
  pullPolicy: IfNotPresent
