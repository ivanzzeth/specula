{{- if .Values.deployment.enabled }}
{{- /*
Credentials supplied inline in the deployment profile get their own Secret here, so
one values file is genuinely enough — no out-of-band `kubectl create secret` step.
existingSecret still wins when set, for setups where a secrets operator owns them.

The values themselves already live in helm's release Secret regardless, so writing
them in a profile file is no worse than passing --set; keep the real profile out of
git (see deploy/profiles/README.md).
*/ -}}
{{- $needMeta := and (eq .Values.meta.driver "postgres") (not .Values.meta.existingSecret) -}}
{{- $needBlob := and (eq .Values.blob.driver "s3") (not .Values.blob.s3.existingSecret) (.Values.blob.s3.accessKeyId) -}}
{{- if or $needMeta $needBlob }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "specula-bootstrap.fullname" . }}-creds
  labels:
    {{- include "specula-bootstrap.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needMeta }}
  dsn: {{ required "meta.dsn is required when meta.driver=postgres (or set meta.existingSecret)" .Values.meta.dsn | quote }}
  {{- end }}
  {{- if $needBlob }}
  access-key-id: {{ .Values.blob.s3.accessKeyId | quote }}
  secret-access-key: {{ required "blob.s3.secretAccessKey is required alongside accessKeyId" .Values.blob.s3.secretAccessKey | quote }}
  {{- end }}
{{- end }}
{{- end }}
