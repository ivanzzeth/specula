apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "specula-bootstrap.fullname" . }}
  labels:
    {{- include "specula-bootstrap.labels" . | nindent 4 }}
data:
  specula.yaml: |
    server:
      listen_addr: ":{{ .Values.service.port }}"
      {{- with .Values.registryPublicHost }}
      registry_public_host: {{ . | quote }}
      {{- end }}
      ha: {{ .Values.ha }}
      {{- if .Values.tls.enabled }}
      tls:
        cert_file: /etc/specula/tls/tls.crt
        key_file: /etc/specula/tls/tls.key
      {{- end }}

    {{- if .Values.ha }}
    coalesce:
      # postgres advisory locks on the meta pool — Redis-free HA.
      lock_driver: {{ .Values.lockDriver | quote }}
      {{- if eq .Values.lockDriver "redis" }}
      redis:
        addr: {{ required "redisAddr is required when ha=true and lockDriver=redis" .Values.redisAddr | quote }}
        db: 0
        key_prefix: "specula:lock:"
      {{- end }}
    {{- end }}

    storage:
      blob:
        driver: {{ .Values.blob.driver | quote }}
        {{- if eq .Values.blob.driver "s3" }}
        s3:
          bucket: {{ required "blob.s3.bucket is required when blob.driver=s3" .Values.blob.s3.bucket | quote }}
          endpoint: {{ .Values.blob.s3.endpoint | quote }}
          region: {{ .Values.blob.s3.region | quote }}
          use_path_style: {{ .Values.blob.s3.usePathStyle }}
        {{- else }}
        local:
          root: {{ .Values.blob.local.root | quote }}
          {{- if .Values.ha }}
          # Operator attestation that this root is a shared RWX volume.
          shared: true
          {{- end }}
        {{- end }}
      # Data volume, not the container's ephemeral layer: a large pull would
      # otherwise burn ephemeral-storage and get the Pod evicted.
      quarantine_dir: /var/lib/specula/quarantine
      meta:
        driver: {{ .Values.meta.driver | quote }}
        {{- if eq .Values.meta.driver "postgres" }}
        # Placeholder only: the real DSN arrives as SPECULA_STORAGE__META__DSN from
        # meta.existingSecret, so the credential never lands in a ConfigMap.
        dsn: "postgres://placeholder/specula"
        {{- else }}
        dsn: {{ .Values.meta.dsn | quote }}
        {{- end }}

    cache:
      default_mutable_ttl_seconds: {{ .Values.cache.defaultMutableTTLSeconds }}
      negative_ttl_seconds: {{ .Values.cache.negativeTTLSeconds }}
      max_bytes: {{ .Values.cache.maxBytes }}

    auth:
      # Empty → auto-generated but EPHEMERAL: every restart invalidates all sessions
      # and, with more than one replica, sessions are not shared. Set it (base64 of
      # exactly 32 bytes) for anything long-lived. Anonymous pull-through of public
      # upstreams works either way — that is the point of a bootstrap mirror.
      config_secret: {{ .Values.auth.configSecret | quote }}
      cookie_secure: {{ .Values.auth.cookieSecure | default .Values.tls.enabled }}

    {{- with .Values.egressProxy.url }}
    # Last-resort proxy for official:true upstreams only (CN mirrors stay direct).
    # Typical in-cluster: http://trust-proxy.trust-proxy.svc:21584 (mode=manual).
    egress:
      official_proxy: {{ . | quote }}
    {{- end }}

    # NOTHING about protocols is written here by default.
    #
    # Specula serves every protocol it implements — oci, npm, pypi, go, apt, helm,
    # cargo, conda, hf — from the binary's built-in China-first table
    # (internal/config/example.yaml): mirror chains, per-protocol TTLs, verification
    # tiers, and the OCI remote_registries allowlist for ghcr.io, quay.io,
    # registry.k8s.io, gcr.io, k8s.gcr.io, mcr.microsoft.com and codeberg.org.
    #
    # This chart used to restate all of it. Two things came of that: the copy was
    # already missing mirrors the binary had, and its Hub chain was DaoCloud + Docker
    # Hub only — so when DaoCloud tripped its circuit breaker the sole remaining
    # fallback was the official origin, unreachable from CN, and every Hub blob GET
    # became `502 upstream fetch failed`.
    #
    # What appears below is only what an operator explicitly asked for:
    #   upstreams.oci       → replaces the Hub chain
    #   remoteRegistries    → replaces the path-style registry allowlist
    #   protocolOverrides   → anything else, merged verbatim
{{- if or .Values.protocolOverrides .Values.upstreams.oci .Values.remoteRegistries .Values.git.enabled }}
    protocols:
      {{- if .Values.git.enabled }}
      # git clone acceleration (opt-in): node-local bare mirrors of PUBLIC repos.
      # Explicit config here is the escape hatch past the HA default-drop
      # (internal/config/protocol_defaults.go gitIsHAUnsafe). Under >1 replica each
      # replica keeps its own mirror — fine for a read-only public pull-through cache.
      git:
        {{- /* git has NO built-in upstream chain, so Specula Validate rejects a
             git block with zero upstreams. Every sub-value is defaulted HERE, at
             the template, because `helm upgrade --reuse-values` reuses the stored
             release values and does NOT re-read this chart's values.yaml defaults
             — so `--set git.enabled=true` alone would otherwise render null
             upstreams and crashloop the pod. Defaulting in-template keeps the
             minimal opt-in valid regardless of how values arrive. */}}
        {{- $ups := .Values.git.allowedUpstreams | default (list "github.com") }}
        upstreams:
          {{- range $i, $h := $ups }}
          - name: {{ $h | quote }}
            base_url: https://{{ $h }}
            priority: {{ add $i 1 }}
            official: {{ eq $i 0 }}
          {{- end }}
        git:
          allowed_upstreams:
            {{- toYaml $ups | nindent 12 }}
          mirror_dir: {{ .Values.git.mirrorDir | default "/var/lib/specula/git" | quote }}
          sync_stale_after: {{ .Values.git.syncStaleAfter | default "30s" | quote }}
          {{- /* booleans: hasKey distinguishes an explicit false from unset, so a
               deliberate publicOnly=false is respected while an unset value takes
               the secure default (Helm `default` treats false as empty). */}}
          public_only: {{ if hasKey .Values.git "publicOnly" }}{{ .Values.git.publicOnly }}{{ else }}true{{ end }}
          fail_closed: {{ if hasKey .Values.git "failClosed" }}{{ .Values.git.failClosed }}{{ else }}true{{ end }}
      {{- end }}
      {{- with .Values.protocolOverrides }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if or .Values.upstreams.oci .Values.remoteRegistries }}
      oci:
        {{- with .Values.upstreams.oci }}
        upstreams:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.remoteRegistries }}
        oci:
          remote_registries:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      {{- end }}
{{- end }}
