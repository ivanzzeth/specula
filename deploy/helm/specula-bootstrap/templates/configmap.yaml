{{- $cn := or (eq .Values.regionProfile "cn") (eq .Values.regionProfile "CN") -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "specula-bootstrap.fullname" . }}
  labels:
    {{- include "specula-bootstrap.labels" . | nindent 4 }}
data:
  specula.yaml: |
    server:
      data_plane_addr: ":{{ .Values.service.dataPort }}"
      control_plane_addr: ":{{ .Values.service.controlPort }}"
      ha: {{ .Values.ha }}
      {{- if .Values.tls.enabled }}
      tls:
        cert_file: /etc/specula/tls/tls.crt
        key_file: /etc/specula/tls/tls.key
      {{- end }}

    {{- if .Values.ha }}
    coalesce:
      # postgres advisory locks on the meta pool — Redis-free HA.
      lock_driver: {{ .Values.lockDriver | quote }}
      {{- if eq .Values.lockDriver "redis" }}
      redis:
        addr: {{ required "redisAddr is required when ha=true and lockDriver=redis" .Values.redisAddr | quote }}
        db: 0
        key_prefix: "specula:lock:"
      {{- end }}
    {{- end }}

    storage:
      blob:
        driver: {{ .Values.blob.driver | quote }}
        {{- if eq .Values.blob.driver "s3" }}
        s3:
          bucket: {{ required "blob.s3.bucket is required when blob.driver=s3" .Values.blob.s3.bucket | quote }}
          endpoint: {{ .Values.blob.s3.endpoint | quote }}
          region: {{ .Values.blob.s3.region | quote }}
          use_path_style: {{ .Values.blob.s3.usePathStyle }}
        {{- else }}
        local:
          root: {{ .Values.blob.local.root | quote }}
          {{- if .Values.ha }}
          # Operator attestation that this root is a shared RWX volume.
          shared: true
          {{- end }}
        {{- end }}
      # Data volume, not the container's ephemeral layer: a large pull would
      # otherwise burn ephemeral-storage and get the Pod evicted.
      quarantine_dir: /var/lib/specula/quarantine
      meta:
        driver: {{ .Values.meta.driver | quote }}
        {{- if eq .Values.meta.driver "postgres" }}
        # Placeholder only: the real DSN arrives as SPECULA_STORAGE__META__DSN from
        # meta.existingSecret, so the credential never lands in a ConfigMap.
        dsn: "postgres://placeholder/specula"
        {{- else }}
        dsn: {{ .Values.meta.dsn | quote }}
        {{- end }}

    cache:
      default_mutable_ttl_seconds: {{ .Values.cache.defaultMutableTTLSeconds }}
      negative_ttl_seconds: {{ .Values.cache.negativeTTLSeconds }}
      max_bytes: {{ .Values.cache.maxBytes }}

    auth:
      # Empty → Specula auto-generates and persists in the SQLite settings store.
      # Anonymous pull-through of public upstream repos still works (that is the
      # whole point of a bootstrap mirror).
      config_secret: ""
      cookie_secure: {{ .Values.tls.enabled }}

    protocols:
      oci:
        mutable_ttl_seconds: 300
        upstreams:
          {{- toYaml .Values.upstreams.oci | nindent 10 }}
        verification:
          tiers: [tofu, checksum]
          quorum: 1
          tofu: enforce
        {{- if .Values.remoteRegistries }}
        oci:
          remote_registries:
            {{- toYaml .Values.remoteRegistries | nindent 12 }}
        {{- else if $cn }}
        oci:
          remote_registries:
            {{- include "specula-bootstrap.cnRemoteRegistries" . | nindent 12 }}
        {{- end }}
