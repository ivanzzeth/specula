apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "specula-bootstrap.fullname" . }}
  labels:
    {{- include "specula-bootstrap.labels" . | nindent 4 }}
spec:
  # Single replica: SQLite + local blob are node-local and not shared.
  {{- if not .Values.autoscaling.enabled }}
  # HPA owns the count when enabled; leaving replicas set fights it every reconcile.
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "specula-bootstrap.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "specula-bootstrap.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      # fsGroup is REQUIRED, not cosmetic. The image runs as nonroot (uid 65532)
      # while a freshly provisioned CSI volume mounts as root:root 0755, so the
      # daemon cannot create /var/lib/specula/{blobs,quarantine} and dies with
      # "mkdir: permission denied" on EVERY cloud CSI driver. minikube's hostpath
      # provisioner hands out 0777 and hides this completely.
      # fsGroup makes kubelet chgrp+setgid the volume to this GID before start.
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: specula
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - /etc/specula/specula.yaml
          {{- $pgMeta := eq .Values.meta.driver "postgres" }}
          {{- $s3Creds := and (eq .Values.blob.driver "s3") .Values.blob.s3.existingSecret }}
          {{- if or $pgMeta $s3Creds }}
          # Credentials come from Secrets as env vars: SPECULA_ env overrides the
          # config file, so nothing sensitive lands in a ConfigMap. The strict loader
          # means a missing key fails fast at startup instead of degrading silently.
          env:
            {{- if $pgMeta }}
            - name: SPECULA_STORAGE__META__DSN
              valueFrom:
                secretKeyRef:
                  name: {{ required "meta.existingSecret is required when meta.driver=postgres" .Values.meta.existingSecret }}
                  key: {{ .Values.meta.dsnKey | default "dsn" }}
            {{- end }}
            {{- if $s3Creds }}
            - name: SPECULA_STORAGE__BLOB__S3__ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.blob.s3.existingSecret }}
                  key: {{ .Values.blob.s3.accessKeyIDKey | default "access-key-id" }}
            - name: SPECULA_STORAGE__BLOB__S3__SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.blob.s3.existingSecret }}
                  key: {{ .Values.blob.s3.secretAccessKeyKey | default "secret-access-key" }}
            {{- end }}
          {{- end }}
          ports:
            - name: data
              containerPort: {{ .Values.service.dataPort }}
              protocol: TCP
            - name: control
              containerPort: {{ .Values.service.controlPort }}
              protocol: TCP
          # /v2/ is the auth-handshake endpoint (401 by protocol); /healthz is the
          # unauthenticated liveness signal served on the data listener.
          livenessProbe:
            httpGet:
              path: /healthz
              port: data
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: data
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          {{- if .Values.tls.enabled }}
          volumeMounts:
            - name: config
              mountPath: /etc/specula
              readOnly: true
            - name: data
              mountPath: /var/lib/specula
            - name: tls
              mountPath: /etc/specula/tls
              readOnly: true
          {{- else }}
          volumeMounts:
            - name: config
              mountPath: /etc/specula
              readOnly: true
            - name: data
              mountPath: /var/lib/specula
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "specula-bootstrap.fullname" . }}
        - name: data
          {{- if .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | quote }}
          {{- else if .Values.persistence.hostPath }}
          hostPath:
            path: {{ .Values.persistence.hostPath | quote }}
            type: DirectoryOrCreate
          {{- else if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "specula-bootstrap.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName | default (printf "%s-tls" (include "specula-bootstrap.fullname" .)) }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
