# Bootstrap Specula: single replica, zero external image dependencies beyond
# Specula itself. Land the image via `docker save/load`, offline tar, or a
# China-reachable registry (Aliyun ACR, etc.). Every other image then flows
# THROUGH this instance once the mirror DaemonSet runs.
#
# Critical: OCI upstreams must be REACHABLE from the cluster. In China do NOT
# point at registry-1.docker.io — use a domestic mirror (DaoCloud default below).

image:
  repository: ivanzz/specula
  tag: latest
  # Bootstrap images are usually side-loaded, so default to not re-pulling.
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# See deploy/helm/specula chart: {SVCNAME}_* env vars collide with the SPECULA_
# config prefix. Always keep off.
enableServiceLinks: false

# Pod-level securityContext. fsGroup must match the image's runtime GID (distroless
# nonroot = 65532): without it a CSI-provisioned PVC mounts root:root 0755 and the
# non-root daemon cannot create its data dirs. Set to {} only if you run a custom
# image as root.
podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

service:
  dataPort: 7732
  controlPort: 7733
  # NodePort so the node's container runtime (containerd/docker) can reach the
  # mirror at 127.0.0.1:<nodePort> — cluster DNS is NOT resolvable by the runtime.
  dataNodePort: 30732
  controlNodePort: 30733

# Data volume for Specula blob/SQLite cache. Modes (priority):
#   existingClaim > hostPath > created PVC (enabled=true) > emptyDir
# cluster install defaults enabled=true; falls back to emptyDir without StorageClass.
persistence:
  enabled: true
  # Mount an already-provisioned PVC (skips creating one).
  existingClaim: ""
  # Node-local dir when there is no provisioner (single-node / air-gap).
  hostPath: ""
  size: 20Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

# Upstreams the bootstrap mirror proxies. Defaults target China-reachable
# endpoints (DaoCloud). Override for other regions. See values-cn.yaml.
upstreams:
  oci:
    - name: daocloud
      base_url: https://docker.m.daocloud.io
      priority: 1
      official: false
    - name: dockerhub
      base_url: https://registry-1.docker.io
      priority: 10
      official: true

# Path-style multi-registry allowlist (SSRF). Empty = Hub-only.
# CN overlay (values-cn / regionProfile=cn via CLI --cn) fills these.
remoteRegistries: []

# When true (or regionProfile=cn), ConfigMap embeds the CN k8s mirror chain
# (Huawei SWR layout:huawei-ddn → DaoCloud → 1ms) for registry.k8s.io / k8s.gcr.io.
regionProfile: ""

cache:
  defaultMutableTTLSeconds: 300
  negativeTTLSeconds: 1800
  maxBytes: 0

# ── Phase 1: node mirror config (privileged DaemonSet) ────────────────────────
# Runs `specula bootstrap-mirror write` from the SAME Specula image (no busybox).
# Writes containerd hosts.d drop-ins pointing registries at the NodePort.
# SECURITY: mounts a host path and runs privileged — review before use.
mirror:
  enabled: true
  # containerd certs.d root. k3s: /var/lib/rancher/k3s/agent/etc/containerd/certs.d
  certsDir: /etc/containerd/certs.d
  # Also write k3s agent certs.d when that path exists on the node (integrate DS).
  k3sCertsDir: /var/lib/rancher/k3s/agent/etc/containerd/certs.d
  registries:
    - docker.io
    - registry.k8s.io
    - k8s.gcr.io
    - ghcr.io
    - quay.io
    - gcr.io
    - codeberg.org
  # The mirror endpoint the node dials. Defaults to the host's own NodePort.
  endpoint: "http://127.0.0.1:30732"
  skipVerify: true

# ── Phase 1b: full-protocol integrate DaemonSet ───────────────────────────────
# Runs `specula integrate` on every node (OCI + optional helm/apt). Same image.
integrate:
  enabled: true
  protocols: "oci"
  # When true, also wire helm + apt drop-ins (needs host paths mounted).
  includeClientProtocols: false
  # Hold the container so the DS stays Ready (re-run by deleting the pod).
  hold: true
  # Re-run hosts.toml + integrate while holding (drift repair).
  reconcileInterval: 5m
  # false | true | once — "once" restarts containerd only when CRI config hash
  # changes AND Specula /healthz is up (stamp: /var/lib/specula/.cri-reload-hash).
  restartContainerd: once
  # Host path for reload stamp (and optional shared state).
  stampHostPath: /var/lib/specula

# ── TLS (optional): mint CA+server cert into a Secret; mount on Specula ───────
# Disabled by default for chicken-egg bootstrap (HTTP NodePort + skip_verify).
# `specula cluster install` can enable and push a Secret from the client.
tls:
  enabled: false
  secretName: ""
  # Host path where integrate DS seeds ca.crt for --ca-file.
  caHostPath: /etc/specula/ca.crt

# ── Phase 2: warm HA dependency manifests through the mirror ──────────────────
# Runs `specula bootstrap-prefetch` from the SAME Specula image.
prefetch:
  enabled: false
  images:
    - docker.io/bitnami/postgresql:latest
    - docker.io/bitnami/redis:latest
    - registry.k8s.io/metrics-server/metrics-server:v0.8.1
    - registry.k8s.io/pause:3.9

# ── Phase 3: upgrade to the full HA Specula (installer Job) ────────────────────
# Opt-in. Chart MUST be a local path mounted into the Job (CN: no oci://ghcr).
# Default chart path is the sibling chart under /charts/specula (see volume).
installer:
  enabled: false
  image:
    repository: alpine/helm
    tag: "3.16.3"
    pullPolicy: IfNotPresent
  clusterRole: cluster-admin
  release: specula
  # Local path inside the Job pod — never default to oci://ghcr.io.
  chart: /charts/specula
  targetNamespace: specula
  timeout: 15m
  extraArgs: []
  # Host path or emptyDir source for the packaged HA chart (operator fills).
  chartHostPath: ""
