# Bootstrap Specula: single replica, zero external image dependencies beyond
# Specula itself. Land the image via `docker save/load`, offline tar, or a
# China-reachable registry (Aliyun ACR, etc.). Every other image then flows
# THROUGH this instance once the mirror DaemonSet runs.
#
# Critical: OCI upstreams must be REACHABLE from the cluster. The built-in chain is
# already China-first (DaoCloud → 1ms → Aliyun → Docker Hub); if you override
# upstreams.oci, do NOT leave registry-1.docker.io as the only fallback.

image:
  repository: ivanzz/specula
  tag: latest
  # Bootstrap images are usually side-loaded, so default to not re-pulling.
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# See deploy/helm/specula chart: {SVCNAME}_* env vars collide with the SPECULA_
# config prefix. Always keep off.
enableServiceLinks: false

# Pod-level securityContext. fsGroup must match the image's runtime GID (distroless
# nonroot = 65532): without it a CSI-provisioned PVC mounts root:root 0755 and the
# non-root daemon cannot create its data dirs. Set to {} only if you run a custom
# image as root.
podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Set false to deploy ONLY the mirror DaemonSet — a client cluster whose nodes point
# at a Specula hosted somewhere else. No Deployment, Service, PVC, Secret or HPA.
deployment:
  enabled: true

# Public access via an Ingress. One Service port means one "/" rule covers protocols,
# the Admin API, probes and the WebUI. Set registryPublicHost alongside it: behind an
# Ingress the request carries the ingress host and :443, so Specula cannot infer what
# belongs in `docker login <host>`.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: specula.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # e.g.
  # tls:
  #   - hosts: [specula.example.com]
  #     secretName: specula-tls

# Host clients use for `docker login` / hosts.toml. REQUIRED when ingress.enabled.
registryPublicHost: ""

service:
  # NodePort (default) keeps node→Specula traffic on localhost.
  # LoadBalancer + an internal annotation exposes a stable VPC address for OTHER
  # clusters. On Alibaba Cloud, intranet means no public IP and no egress bill:
  #   annotations:
  #     service.beta.kubernetes.io/alibaba-cloud-loadbalancer-address-type: intranet
  type: NodePort
  annotations: {}
  # ONE port for protocols + Admin API + WebUI + probes.
  port: 7733
  # NodePort so the node's container runtime (containerd/docker) can reach the
  # mirror at 127.0.0.1:<nodePort> — cluster DNS is NOT resolvable by the runtime.
  nodePort: 30733

# Data volume for Specula blob/SQLite cache. Modes (priority):
#   existingClaim > hostPath > created PVC (enabled=true) > emptyDir
# cluster install defaults enabled=true; falls back to emptyDir without StorageClass.
persistence:
  enabled: true
  # Mount an already-provisioned PVC (skips creating one).
  existingClaim: ""
  # Node-local dir when there is no provisioner (single-node / air-gap).
  hostPath: ""
  size: 20Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

# Docker Hub upstreams. EMPTY MEANS the binary's built-in China-first chain:
# DaoCloud → 1ms → Aliyun → Docker Hub, the same list every other protocol now
# inherits (internal/config/example.yaml).
#
# Do not pin a short chain here without a reason. This used to default to
# DaoCloud + Docker Hub only, which looks fine until DaoCloud trips its circuit
# breaker: the single remaining fallback is the official origin, unreachable from
# CN, so every Hub blob GET turns into `502 upstream fetch failed`. Extra mirrors
# are what makes fallthrough mean anything.
#
# Set this to replace the chain entirely (e.g. an in-house registry). Priority is
# ascending — lower is tried first — and exactly one entry should carry
# official: true.
upstreams:
  oci: []

# Path-style multi-registry allowlist (SSRF). Empty = Hub-only.
# CN overlay (values-cn / regionProfile=cn via CLI --cn) fills these.
remoteRegistries: []

# Per-protocol overrides, merged verbatim into the config's `protocols:` block.
#
# You do not need this to SERVE a protocol: Specula serves every protocol it
# implements (oci, npm, pypi, go, apt, helm, cargo, conda, hf) from a built-in
# China-first upstream chain, whether or not it is named here. Use this only to
# retune one or to switch one off:
#
#   protocolOverrides:
#     hf:
#       enabled: false            # stop serving HuggingFace entirely
#     npm:
#       mutable_ttl_seconds: 60   # keeps the built-in mirror list
#     pypi:
#       upstreams:                # replaces the built-in chain
#         - name: house
#           base_url: https://pypi.internal.example.com
#           priority: 1
#
# `upstreams: []` written here is an error, not a way to disable: use enabled: false.
protocolOverrides: {}

# ── Last-resort proxy for official origins (opt-in) ───────────────────────────
# Stamps egress.official_proxy onto every upstream with official: true AFTER the
# built-in China-first chain is applied — mirrors stay direct. Does NOT replace
# protocolOverrides.oci.upstreams (that would wipe the mirror list).
#
# In-cluster trust-proxy (mode=manual is enough for Specula dials):
#   egressProxy:
#     url: http://trust-proxy.trust-proxy.svc:21584
# Empty = off. The proxy must be reachable FROM Specula Pods (label one node
# trust-proxy.io/gateway=true first so the DaemonSet has endpoints).
egressProxy:
  url: ""

# ── git clone acceleration (opt-in; OFF by default) ───────────────────────────
# Serve public `git clone` through Specula bare mirrors (github.com etc). This is
# the ONE protocol NOT served from the built-in table by default: the git handler
# keeps node-local bare mirrors on disk, so it is opt-in (see gitIsHAUnsafe in
# internal/config/protocol_defaults.go — the default table drops git under HA;
# setting git.enabled here is the explicit escape hatch that survives that drop).
#
# It is a READ-ONLY pull-through cache of PUBLIC repos: git objects are content-
# addressed (immutable), refs carry a short TTL, and private / authenticated
# requests pass through UNCACHED (publicOnly). Under more than one replica each
# replica keeps its OWN mirror — independent caches of the same public upstream,
# which is correct for a read-only cache. If you need a single shared mirror,
# point mirrorDir at an RWX volume instead of the ephemeral data dir.
git:
  enabled: false
  # Host allowlist. A clone whose host is not listed is refused (404), never proxied.
  allowedUpstreams: [github.com]
  # On-disk root for bare mirrors. Defaults to the data volume: ephemeral on an
  # emptyDir (rebuilt on demand), durable on a PVC.
  mirrorDir: /var/lib/specula/git
  # Staleness window before a `git remote update` on the next request (Go duration).
  syncStaleAfter: 30s
  # Cache only anonymously-readable repos; pass private/authed through uncached.
  publicOnly: true
  # On a public-visibility probe failure, pass through (bypass) rather than serve a
  # possibly-poisoned stale mirror.
  failClosed: true

# When true (or regionProfile=cn), ConfigMap embeds the CN k8s mirror chain
# (Huawei SWR layout:huawei-ddn → DaoCloud → 1ms) for registry.k8s.io / k8s.gcr.io.
regionProfile: ""

# ── Replicas / HA ─────────────────────────────────────────────────────────────
# Stateless shape (meta.driver=postgres AND blob.driver=s3) is the only one that can
# run more than one replica or move between nodes. With sqlite/local the Pod owns a
# RWO volume and MUST stay at replicaCount 1, pinned.
#
# ha=true additionally needs a cross-replica stampede lock. lock_driver=postgres uses
# advisory locks on the meta pool, so no Redis is required — size the pool for
# concurrent cold misses.
# Where more than one replica IS allowed (the stateless shape above), pushing to it
# needs nothing extra: blob upload sessions live in the metadata tier with their chunk
# bytes in the blob store, so a docker/crane push whose POST, PATCH and PUT land on
# different Pods still completes. No sessionAffinity, no Ingress cookie affinity.
replicaCount: 1
ha: false
lockDriver: postgres # postgres | redis | local (only read when ha=true)
redisAddr: ""        # required when ha=true and lockDriver=redis

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 0

# ── Blob store (CAS) ──────────────────────────────────────────────────────────
# local: content-addressed tree on the data volume. Ties the Pod to that volume's
#        node; fine for a per-cluster mirror.
# s3:    any S3-compatible object store (Aliyun OSS, Tencent COS, Huawei OBS, MinIO,
#        AWS). Combined with meta.driver=postgres the Pod becomes stateless — which
#        is what a centrally hosted Specula needs.
#
# Credentials come from a Secret, never values. Leave existingSecret empty to use the
# SDK credential chain (instance role / RRSA), which is preferable where available.
blob:
  driver: local
  local:
    root: /var/lib/specula/blobs
  s3:
    bucket: ""
    # Prefer the PUBLIC endpoint unless the Pod network can reach the cloud
    # VPC endpoint. Aliyun OSS `-internal` resolves to 100.115.x; overlay /
    # Tailscale / cross-VPC nodes get TLS handshake timeouts (EOF) and every
    # OCI push becomes BLOB_UPLOAD_INVALID / 500 on blob HEAD.
    #   public:   https://oss-<region>.aliyuncs.com
    #   internal: https://oss-<region>-internal.aliyuncs.com  (same VPC only)
    endpoint: ""
    region: ""
    # OSS/COS/OBS are virtual-host style (false). MinIO needs true.
    usePathStyle: false
    # Put the credentials right here and the chart creates the Secret for you.
    # Leave BOTH empty to use the SDK credential chain (instance role / RRSA).
    accessKeyId: ""
    secretAccessKey: ""
    # …or reference a Secret you already created. Takes precedence when set.
    existingSecret: ""
    accessKeyIDKey: access-key-id
    secretAccessKeyKey: secret-access-key

# ── Metadata store ────────────────────────────────────────────────────────────
# sqlite (default) keeps everything on the data volume — simplest, but the Pod is
# then pinned to that volume's node and `helm uninstall` discards the DB along with
# the PVC (which holds TOFU pins and user accounts, not only cache entries).
#
# postgres points meta at an external database (RDS/CloudSQL/self-hosted). Schema
# migrations run automatically at startup (embedded goose). This does NOT require
# server.ha — a single replica with external meta is a supported shape and the step
# that makes the Pod survive losing its node.
#
# Supply the DSN through a Secret, never in values: put a key holding
# postgres://user:pass@host:5432/specula?sslmode=require in it and reference it
# here. It is injected as SPECULA_STORAGE__META__DSN, which overrides the file.
meta:
  driver: sqlite
  # sqlite: file path on the data volume.
  # postgres: full DSN — put it here and the chart creates the Secret for you, e.g.
  #   postgres://specula:pw@pg-x.pg.rds.aliyuncs.com:5432/specula?sslmode=require
  dsn: /var/lib/specula/meta.db
  # …or reference a Secret you already created. Takes precedence when set.
  existingSecret: ""
  dsnKey: dsn

# ── Control-plane auth ────────────────────────────────────────────────────────
# There is no default account: the first account created while the user count is
# zero becomes admin. Register right after install.
#
# configSecret is base64 of exactly 32 bytes (openssl rand -base64 32). It encrypts
# the runtime-settings store, which is what makes the auto-generated JWT secret
# durable. Empty = ephemeral: every restart signs everyone out, and replicas do not
# share sessions. A malformed value is a startup error, never a silent downgrade.
auth:
  configSecret: ""
  cookieSecure: false

cache:
  defaultMutableTTLSeconds: 300
  negativeTTLSeconds: 1800
  maxBytes: 0

# ── Phase 1: node mirror config (privileged DaemonSet) ────────────────────────
# Runs `specula bootstrap-mirror write` from the SAME Specula image (no busybox).
# Writes containerd hosts.d drop-ins pointing registries at the NodePort.
# SECURITY: mounts a host path and runs privileged — review before use.
mirror:
  enabled: true
  # containerd certs.d root. k3s: /var/lib/rancher/k3s/agent/etc/containerd/certs.d
  certsDir: /etc/containerd/certs.d
  # Also write k3s agent certs.d when that path exists on the node (integrate DS).
  k3sCertsDir: /var/lib/rancher/k3s/agent/etc/containerd/certs.d
  registries:
    - docker.io
    - registry.k8s.io
    - k8s.gcr.io
    - ghcr.io
    - quay.io
    - gcr.io
    - codeberg.org
  # The mirror endpoint the node dials. Defaults to the host's own NodePort.
  endpoint: "http://127.0.0.1:30733"
  skipVerify: true

# ── Phase 1b: full-protocol integrate DaemonSet ───────────────────────────────
# Runs `specula bootstrap-node` → integrate on every node. Same image.
# protocols MUST default to integrate.DefaultProtocols (all) — never "oci" alone
# (chorei iron law #23 / Specula delivery contract: do not narrow protocols).
integrate:
  enabled: true
  protocols: "go,npm,pypi,oci,helm,git,apt,cargo,conda,hf"
  # When true, appends helm,apt if missing from protocols (legacy escape hatch;
  # unnecessary when protocols already lists DefaultProtocols).
  includeClientProtocols: false
  # Hold the container so the DS stays Ready (re-run by deleting the pod).
  hold: true
  # Re-run hosts.toml + integrate while holding (drift repair).
  reconcileInterval: 5m
  # false | true | once — "once" restarts containerd only when CRI config hash
  # changes AND Specula /healthz is up (stamp: /var/lib/specula/.cri-reload-hash).
  restartContainerd: once
  # Host path for reload stamp (and optional shared state).
  stampHostPath: /var/lib/specula

# ── TLS (optional): mint CA+server cert into a Secret; mount on Specula ───────
# Disabled by default for chicken-egg bootstrap (HTTP NodePort + skip_verify).
# `specula cluster install` can enable and push a Secret from the client.
tls:
  enabled: false
  secretName: ""
  # Host path where integrate DS seeds ca.crt for --ca-file.
  caHostPath: /etc/specula/ca.crt

# ── Phase 2: warm HA dependency manifests through the mirror ──────────────────
# Runs `specula bootstrap-prefetch` from the SAME Specula image.
prefetch:
  enabled: false
  images:
    - docker.io/bitnami/postgresql:latest
    - docker.io/bitnami/redis:latest
    - registry.k8s.io/metrics-server/metrics-server:v0.8.1
    - registry.k8s.io/pause:3.9

# ── Phase 3: upgrade to the full HA Specula (installer Job) ────────────────────
# Opt-in. Chart MUST be a local path mounted into the Job (CN: no oci://ghcr).
# Default chart path is the sibling chart under /charts/specula (see volume).
installer:
  enabled: false
  image:
    repository: alpine/helm
    tag: "3.16.3"
    pullPolicy: IfNotPresent
  clusterRole: cluster-admin
  release: specula
  # Local path inside the Job pod — never default to oci://ghcr.io.
  chart: /charts/specula
  targetNamespace: specula
  timeout: 15m
  extraArgs: []
  # Host path or emptyDir source for the packaged HA chart (operator fills).
  chartHostPath: ""
