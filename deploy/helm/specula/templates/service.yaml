apiVersion: v1
kind: Service
metadata:
  name: {{ include "specula.fullname" . }}
  labels:
    {{- include "specula.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "specula.selectorLabels" . | nindent 4 }}
  ports:
    # Exactly one port: protocols, Admin API, probes and the WebUI share it.
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
