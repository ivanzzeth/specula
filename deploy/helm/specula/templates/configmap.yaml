apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "specula.configMapName" . }}
  labels:
    {{- include "specula.labels" . | nindent 4 }}
data:
  specula.yaml: |
    server:
      listen_addr: ":{{ .Values.service.port }}"
      ha: true

    coalesce:
      lock_driver: redis
      redis:
        addr: {{ include "specula.redis.host" . }}:6379
        db: 0
        key_prefix: "specula:lock:"

    storage:
      blob:
        driver: {{ .Values.blob.driver | quote }}
        {{- if eq .Values.blob.driver "local" }}
        local:
          root: {{ .Values.blob.local.root | quote }}
          shared: true
        {{- else if eq .Values.blob.driver "s3" }}
        s3:
          bucket: {{ .Values.blob.s3.bucket | quote }}
          endpoint: {{ include "specula.blob.s3.endpoint" . | quote }}
          region: {{ .Values.blob.s3.region | quote }}
          use_path_style: {{ .Values.blob.s3.usePathStyle }}
        {{- end }}
      # Local scratch on every replica: upstream bytes are hashed here before
      # admission to the shared CAS. Must be the data volume, not /tmp (tmpfs =
      # RAM) and not the ephemeral container layer.
      quarantine_dir: {{ .Values.quarantineDir | quote }}
      meta:
        driver: postgres
        # Overridden at runtime by SPECULA_STORAGE__META__DSN (password from Secret).
        dsn: "postgres://specula@postgresql:5432/specula?sslmode=disable"

    cache:
      default_mutable_ttl_seconds: {{ .Values.cache.defaultMutableTTLSeconds }}
      negative_ttl_seconds: {{ .Values.cache.negativeTTLSeconds }}
      max_bytes: {{ .Values.cache.maxBytes }}

    auth:
      cookie_secure: {{ .Values.auth.cookieSecure }}

    # Git is omitted in HA: bare mirrors are node-local and not shared across replicas.
    protocols:
      {{- with .Values.protocolOverrides }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
{{- if eq .Values.regionProfile "cn" }}
      oci:
        mutable_ttl_seconds: 300
        upstreams:
          - name: daocloud
            base_url: https://docker.m.daocloud.io
            priority: 1
            official: false
          - name: 1ms
            base_url: https://docker.1ms.run
            priority: 2
            official: false
          - name: aliyun
            base_url: https://registry.aliyuncs.com
            priority: 3
            official: false
          - name: docker-hub
            base_url: https://registry-1.docker.io
            priority: 4
            official: true
        verification:
          tiers: [tofu, checksum]
          quorum: 2
        oci:
          remote_registries:
            - host: quay.io
              upstreams:
                - name: daocloud
                  base_url: https://quay.m.daocloud.io
                  priority: 1
                - name: 1ms
                  base_url: https://quay.1ms.run
                  priority: 2
            - host: ghcr.io
              upstreams:
                - name: daocloud
                  base_url: https://ghcr.m.daocloud.io
                  priority: 1
                - name: 1ms
                  base_url: https://ghcr.1ms.run
                  priority: 2
            - host: registry.k8s.io
              upstreams:
                - name: daocloud
                  base_url: https://k8s.m.daocloud.io
                  priority: 1
                - name: 1ms
                  base_url: https://k8s.1ms.run
                  priority: 2
            - host: gcr.io
              upstreams:
                - name: daocloud
                  base_url: https://gcr.m.daocloud.io
                  priority: 1
                - name: 1ms
                  base_url: https://gcr.1ms.run
                  priority: 2
            - host: k8s.gcr.io
              upstreams:
                - name: daocloud
                  base_url: https://k8s-gcr.m.daocloud.io
                  priority: 1
                - name: 1ms
                  base_url: https://k8s.1ms.run
                  priority: 2
            - host: mcr.microsoft.com
              upstreams:
                - name: daocloud
                  base_url: https://mcr.m.daocloud.io
                  priority: 1
                - name: 1ms
                  base_url: https://mcr.1ms.run
                  priority: 2
            - host: codeberg.org
      # npm, pypi, go, apt, cargo, conda and hf are NOT listed here on purpose.
      # Specula serves every protocol it implements from a built-in China-first
      # upstream chain (parsed from internal/config/example.yaml), so restating that
      # table in the chart only gave it a second copy to drift from — this one was
      # already missing the USTC/Tencent/Huawei mirrors the binary now defaults to.
      # Override or disable one via protocolOverrides; `enabled: false` switches a
      # protocol off. Only OCI stays spelled out, for its remote_registries allowlist.
{{- else }}
      oci:
        mutable_ttl_seconds: 300
        upstreams:
          - name: docker-hub
            base_url: https://registry-1.docker.io
            priority: 1
            official: true
        verification:
          tiers: [tofu, checksum]
          quorum: 1
          tofu: enforce
      go:
        mutable_ttl_seconds: 300
        upstreams:
          - name: proxy.golang.org
            base_url: https://proxy.golang.org
            priority: 1
            official: true
        verification:
          tiers: [signed, tofu, checksum]
          quorum: 1
        sumdb:
          url: https://sum.golang.org
          policy: enforce
      pypi:
        mutable_ttl_seconds: 1800
        upstreams:
          - name: pypi-org
            base_url: https://pypi.org
            priority: 1
            official: true
        verification:
          tiers: [tofu, checksum]
          quorum: 1
          tofu: enforce
      npm:
        mutable_ttl_seconds: 120
        upstreams:
          - name: npm-registry
            base_url: https://registry.npmjs.org
            priority: 1
            official: true
        verification:
          tiers: [tofu, checksum]
          quorum: 1
          tofu: enforce
      helm:
        mutable_ttl_seconds: 1800
        upstreams:
          - name: bitnami
            base_url: https://charts.bitnami.com/bitnami
            priority: 1
            official: true
        verification:
          tiers: [tofu, checksum]
          quorum: 1
          tofu: enforce
      apt:
        mutable_ttl_seconds: 0
        upstreams:
          - name: ubuntu-archive
            base_url: https://archive.ubuntu.com/ubuntu
            priority: 1
            official: true
        verification:
          tiers: [signed, tofu, checksum]
          quorum: 1
          tofu: enforce
      cargo:
        mutable_ttl_seconds: 300
        upstreams:
          - name: index-crates-io
            base_url: https://index.crates.io
            priority: 1
            official: true
        cargo:
          dl_upstreams:
            - name: static-crates-io
              base_url: https://static.crates.io
              priority: 1
              official: true
        verification:
          tiers: [tofu, checksum]
          quorum: 1
          tofu: enforce
      conda:
        mutable_ttl_seconds: 300
        upstreams:
          - name: anaconda-cloud
            base_url: https://conda.anaconda.org
            priority: 1
            official: true
        verification:
          tiers: [checksum, tofu]
          quorum: 1
          tofu: enforce
      hf:
        mutable_ttl_seconds: 120
        upstreams:
          - name: huggingface
            base_url: https://huggingface.co
            priority: 1
            official: true
        verification:
          tiers: [tofu, checksum]
          quorum: 1
          tofu: enforce
{{- end }}
      tarball:
        mutable_ttl_seconds: -1
        upstreams:
          - name: github
            base_url: https://github.com
            priority: 1
            official: true
        verification:
          tiers: [tofu, checksum]
          quorum: 1
          tofu: enforce
