<!doctype html>
<!--
  Served when the Vite bundle (web/dist) was not built into this binary.

  This file is committed and embedded unconditionally, so a Specula binary
  ALWAYS has a control-plane page: `go build` without a prior `make ui` used to
  produce a binary that compiled, passed `version`, and then panicked on boot
  ("webui: read dist/index.html"), taking the whole data plane down with it.
  The API and every protocol handler work fine in this state — only the SPA is
  missing — so this page says so instead of crashing.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Specula — WebUI not built</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #fafafa;
        color: #18181b;
      }
      main { max-width: 34rem; padding: 2rem; }
      h1 { font-size: 1.25rem; margin: 0 0 .75rem; }
      p { margin: 0 0 1rem; color: #52525b; }
      code, pre {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: .875em;
      }
      pre {
        background: #f4f4f5;
        border: 1px solid #e4e4e7;
        border-radius: 6px;
        padding: .75rem 1rem;
        overflow-x: auto;
      }
      .tag {
        display: inline-block;
        font-size: .75rem;
        letter-spacing: .04em;
        text-transform: uppercase;
        color: #a16207;
        background: #fef9c3;
        border-radius: 4px;
        padding: .15rem .45rem;
        margin-bottom: .75rem;
      }
      a { color: #2563eb; }
      @media (prefers-color-scheme: dark) {
        body { background: #09090b; color: #fafafa; }
        p { color: #a1a1aa; }
        pre { background: #18181b; border-color: #27272a; }
        .tag { color: #fde047; background: #422006; }
        a { color: #60a5fa; }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="tag">WebUI not built</span>
      <h1>Specula is running — the SPA is not in this binary</h1>
      <p>
        Every protocol handler and the Admin API are live. Only the frontend
        bundle is missing: this binary was built without <code>web/dist</code>.
      </p>
      <pre>make ui &amp;&amp; make build-go     # or: make build</pre>
      <p>
        Meanwhile: <a href="/api/v1">/api/v1</a> ·
        <a href="/healthz">/healthz</a> ·
        <a href="/metrics">/metrics</a>
      </p>
    </main>
  </body>
</html>
