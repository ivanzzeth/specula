# Release Specula binaries and container image when a version tag is pushed (e.g. v0.4.0).
# Version identity is the git tag, injected via -ldflags into internal/version.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write # GHCR push uses GITHUB_TOKEN — no extra secret needed

jobs:
  release:
    name: Build & publish binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build WebUI
        run: |
          cd web
          npm ci
          npm run build

      - name: Resolve version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Building Specula ${TAG}"

      - name: Cross-compile binaries
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          COMMIT: ${{ steps.ver.outputs.commit }}
          DATE: ${{ steps.ver.outputs.date }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION_PKG=github.com/ivanzzeth/specula/internal/version
          LDFLAGS="-s -w -X ${VERSION_PKG}.Version=${VERSION} -X ${VERSION_PKG}.Commit=${COMMIT} -X ${VERSION_PKG}.BuildDate=${DATE}"
          mkdir -p dist
          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
          )
          for pair in "${targets[@]}"; do
            set -- $pair
            GOOS=$1 GOARCH=$2
            ext=""
            if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
            out="dist/specula_${VERSION}_${GOOS}_${GOARCH}${ext}"
            echo "==> $out"
            GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags "$LDFLAGS" -o "$out" ./cmd/specula
          done
          # Sanity: linux/amd64 reports the tag.
          chmod +x dist/specula_${VERSION}_linux_amd64
          got="$(dist/specula_${VERSION}_linux_amd64 version)"
          echo "version output: $got"
          echo "$got" | grep -F "$VERSION"

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum specula_* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Specula ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          append_body: true
          body: |
            ### Container image

            Multi-arch (`linux/amd64`, `linux/arm64`), pushed to every registry configured
            in repo secrets. The exact coordinates for this release are in the
            **image** job's run summary.

            ```
            docker pull ivanzz/specula:${{ steps.ver.outputs.version }}                       # Docker Hub
            docker pull ghcr.io/ivanzzeth/specula:${{ steps.ver.outputs.version }}            # GHCR
            docker pull <ACR_REGISTRY>/<ACR_NAMESPACE>/specula:${{ steps.ver.outputs.version }}  # Aliyun ACR
            ```

            **Inside China, use the cloud-region registry (ACR/SWR).** Measured from an
            Alibaba Cloud ACK cluster in cn-chengdu: `registry-1.docker.io` unreachable,
            `docker.m.daocloud.io` 403, `docker.1ms.run` and `docker.xuanyuan.me` both
            timed out. Only the cloud's own registry pulled.
          files: |
            dist/specula_*
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Build, smoke & publish image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build WebUI (needed by ephemeral daemon //go:embed)
        run: |
          cd web
          npm ci
          npm run build

      # Multi-registry fan-out. Every CN-reachable mirror of Docker Hub failed from
      # a real Alibaba Cloud ACK cluster in cn-chengdu — registry-1.docker.io
      # unreachable, docker.m.daocloud.io 403, docker.1ms.run and
      # docker.xuanyuan.me both timed out — while the cloud's own registry pulled
      # fine. So a CN-region registry is not a nice-to-have alternative to Docker
      # Hub, it is the ONLY way a CN cluster can bootstrap Specula's own image.
      #
      # Each target is skipped silently when its secrets are absent, so a fork
      # with no credentials still releases binaries and passes.
      #
      #   Docker Hub  DOCKERHUB_USERNAME  DOCKERHUB_TOKEN
      #   Aliyun ACR  ACR_REGISTRY (e.g. registry.cn-chengdu.aliyuncs.com)
      #               ACR_NAMESPACE  ACR_USERNAME  ACR_PASSWORD
      #   Huawei SWR  SWR_REGISTRY (e.g. swr.cn-north-4.myhuaweicloud.com)
      #               SWR_NAMESPACE  SWR_USERNAME  SWR_PASSWORD
      #   GHCR        none (GITHUB_TOKEN); blocked in CN but free everywhere else
      - name: Resolve version and registry targets
        id: ver
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          SWR_REGISTRY: ${{ secrets.SWR_REGISTRY }}
          SWR_NAMESPACE: ${{ secrets.SWR_NAMESPACE }}
          SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # latest only for stable vX.Y.Z (no -rc / -beta / -alpha suffix)
          stable=false
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then stable=true; fi
          echo "latest=${stable}" >> "$GITHUB_OUTPUT"

          tags=""
          coords=""
          add_repo() {   # add_repo <repo> — appends :TAG and, when stable, :latest
            local repo="$1"
            tags="${tags}${repo}:${TAG}"$'\n'
            if [ "$stable" = true ]; then tags="${tags}${repo}:latest"$'\n'; fi
            coords="${coords}${repo}:${TAG}"$'\n'
          }

          if [ -n "${DOCKERHUB_TOKEN}" ]; then
            add_repo "ivanzz/specula"; echo "push_hub=true" >> "$GITHUB_OUTPUT"
          else
            echo "push_hub=false" >> "$GITHUB_OUTPUT"
            echo "DOCKERHUB_TOKEN unset — skipping Docker Hub."
          fi

          if [ -n "${ACR_REGISTRY}" ] && [ -n "${ACR_NAMESPACE}" ] && [ -n "${ACR_PASSWORD}" ]; then
            add_repo "${ACR_REGISTRY}/${ACR_NAMESPACE}/specula"
            echo "push_acr=true" >> "$GITHUB_OUTPUT"
          else
            echo "push_acr=false" >> "$GITHUB_OUTPUT"
            echo "ACR_* secrets unset — skipping Aliyun ACR (CN clusters will have no reachable image)."
          fi

          if [ -n "${SWR_REGISTRY}" ] && [ -n "${SWR_NAMESPACE}" ] && [ -n "${SWR_PASSWORD}" ]; then
            add_repo "${SWR_REGISTRY}/${SWR_NAMESPACE}/specula"
            echo "push_swr=true" >> "$GITHUB_OUTPUT"
          else
            echo "push_swr=false" >> "$GITHUB_OUTPUT"
          fi

          # GHCR always: no secret to configure, and it costs nothing.
          ghcr_repo="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/specula"
          add_repo "${ghcr_repo}"
          echo "push_ghcr=true" >> "$GITHUB_OUTPUT"

          if [ -z "${tags}" ]; then
            echo "no registry configured — nothing to push" >&2
          fi
          {
            echo "tags<<EOF"; printf '%s' "$tags"; echo "EOF"
            echo "coords<<EOF"; printf '%s' "$coords"; echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "will push:"; printf '  %s\n' ${tags}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (linux/amd64) for smoke
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: |
            specula:${{ steps.ver.outputs.version }}
            specula:local
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ steps.ver.outputs.commit }}
            DATE=${{ steps.ver.outputs.date }}

      - name: Hosted OCI smoke (push product image into ephemeral Specula)
        env:
          IMAGE: specula:${{ steps.ver.outputs.version }}
          HOSTED_TAG: ${{ steps.ver.outputs.version }}
        run: bash scripts/publish-image-smoke.sh

      - name: Log in to Docker Hub
        if: steps.ver.outputs.push_hub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        if: steps.ver.outputs.push_acr == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Log in to Huawei SWR
        if: steps.ver.outputs.push_swr == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Log in to GHCR
        if: steps.ver.outputs.push_ghcr == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ONE build, pushed to every configured registry: buildx accepts tags across
      # different hosts, so the multi-arch image is built and verified once instead
      # of per-registry.
      - name: Build and push multi-arch to all configured registries
        if: steps.ver.outputs.tags != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.ver.outputs.tags }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ steps.ver.outputs.commit }}
            DATE=${{ steps.ver.outputs.date }}

      - name: Summarise published coordinates
        if: steps.ver.outputs.tags != ''
        run: |
          {
            echo "## Published image coordinates"
            echo '```'
            printf '%s\n' "${{ steps.ver.outputs.coords }}"
            echo '```'
            echo "CN clusters: pull through the cloud-region registry (ACR/SWR); Docker Hub"
            echo "and GHCR are not reliably reachable from inside CN."
          } >> "$GITHUB_STEP_SUMMARY"
